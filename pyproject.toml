[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostate"
version = "1.0.0"
description = "Gradient-isolated boundary learning for interpretable EEG transformers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Yogarajan Sivakumar" },
    { name = "Hong Man" },
]
keywords = [
    "EEG", "transformer", "changepoint detection", "auxiliary head collapse",
    "gradient isolation", "interpretability", "sleep staging",
    "seizure detection",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
preprocessing = ["mne>=1.5", "ruptures>=1.1"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.urls]
Repository = "https://github.com/Yogarajan12/neurostate"

[project.scripts]
neurostate-train = "neurostate.cli:train_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
